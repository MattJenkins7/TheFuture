<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Sensor Dashboard</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --card: #fff;
        --text: #222;
        --muted: #666;
        --accent: #1677ff;
        --accent-dark: #0f4fae;
        --ok: #0f9d58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .card {
        background: var(--card);
        border-radius: 8px;
        padding: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 1rem;
      }

      .label {
        font-size: 0.875rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .value {
        margin-top: 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      .buttons {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        flex: 1;
        min-width: 70px;
        min-height: 44px;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:active {
        transform: scale(0.98);
      }

      button.active {
        background: var(--ok);
      }

      .led-btn {
        aspect-ratio: 1;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-weight: 600;
        opacity: 0.4;
        min-height: 44px;
        transition: opacity 0.2s ease;
      }

      .led-btn:hover {
        opacity: 0.6;
      }
      .led-btn.on {
        opacity: 1;
      }

      .status {
        margin-top: 0.75rem;
        color: var(--ok);
        font-size: 0.875rem;
        min-height: 1.2em;
      }

      .chart-container {
        position: relative;
        height: 250px;
        margin-top: 0.75rem;
      }

      .manual-controls {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.75rem;
        margin-top: 0.75rem;
      }

      @media (max-width: 768px) {
        .wrap {
          padding: 0.75rem;
        }

        h1 {
          font-size: 1.5rem;
          margin-bottom: 0.75rem;
        }

        .card {
          padding: 0.75rem;
          margin-bottom: 0.75rem;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 0.75rem;
          margin-bottom: 0.75rem;
        }

        .buttons {
          gap: 0.4rem;
        }

        button {
          padding: 0.65rem 0.8rem;
          font-size: 0.85rem;
          min-width: 60px;
        }

        .manual-controls {
          grid-template-columns: repeat(5, 1fr);
          gap: 0.6rem;
        }

        .chart-container {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>ESP32 Live Dashboard</h1>
      <section class="grid">
        <article class="card">
          <div class="label">Temperature</div>
          <div class="value" id="temperature">-- °C</div>
        </article>
        <article class="card">
          <div class="label">LED Pattern</div>
          <div class="value" id="pattern">OFF</div>
        </article>
      </section>
      <section class="card">
        <div class="label">Change LED Pattern</div>
        <div class="buttons">
          <button data-pattern="OFF">OFF</button>
          <button data-pattern="BLINK">BLINK</button>
          <button data-pattern="CHASE">CHASE</button>
          <button data-pattern="WAVE">WAVE</button>
          <button data-pattern="FLICKER">FLICKER</button>
        </div>
        <div class="status" id="status"></div>
      </section>
      <section class="card">
        <div class="label">Temperature Responsive Mode</div>
        <div class="buttons">
          <button id="tempResponsiveBtn" data-pattern="TEMPERATURE_RESPONSIVE">
            Enable Temp Mode
          </button>
        </div>
        <div class="status" id="tempStatus"></div>
      </section>
      <section class="card">
        <div class="label">Manual LED Control</div>
        <div class="manual-controls">
          <button
            class="led-btn on"
            style="background: #ff4444"
            data-index="0"
            title="LED 1"
          >
            1
          </button>
          <button
            class="led-btn"
            style="background: #ffdd00"
            data-index="1"
            title="LED 2"
          >
            2
          </button>
          <button
            class="led-btn"
            style="background: #00dd00"
            data-index="2"
            title="LED 3"
          >
            3
          </button>
          <button
            class="led-btn"
            style="background: #ffdd00"
            data-index="3"
            title="LED 4"
          >
            4
          </button>
          <button
            class="led-btn"
            style="background: #ff4444"
            data-index="4"
            title="LED 5"
          >
            5
          </button>
        </div>
        <div class="status" id="manualStatus"></div>
      </section>
      <section class="card">
        <div class="label">Temperature Over Time</div>
        <div class="chart-container">
          <canvas id="temperatureChart"></canvas>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script>
      const temperatureEl = document.getElementById("temperature");
      const patternEl = document.getElementById("pattern");
      const statusEl = document.getElementById("status");
      const tempStatus = document.getElementById("tempStatus");
      const tempResponsiveBtn = document.getElementById("tempResponsiveBtn");
      const manualStatus = document.getElementById("manualStatus");

      let temperatureChart = null;
      let ledStates = [true, false, false, false, false];

      const apiCall = async (endpoint, method = "GET", body = null) => {
        const res = await fetch(endpoint, {
          method,
          headers: { "Content-Type": "application/json" },
          ...(body && { body: JSON.stringify(body) }),
        });
        return res.json();
      };

      const showStatus = (el, msg) => {
        el.textContent = msg;
      };

      function initChart() {
        const ctx = document
          .getElementById("temperatureChart")
          .getContext("2d");
        temperatureChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Temperature (°C)",
                data: [],
                borderColor: "#ff4444",
                backgroundColor: "rgba(255, 68, 68, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: false,
                ticks: { callback: (v) => v.toFixed(0) },
              },
              x: { display: false },
            },
          },
        });
      }

      async function updateTemperatureChart() {
        try {
          const data = await apiCall("/api/temperature-history");
          const history = data.history || [];

          if (temperatureChart && history.length > 0) {
            const temps = history.map((e) => e.temp);
            const minTemp = Math.min(...temps);
            const maxTemp = Math.max(...temps);
            const range = maxTemp - minTemp;
            const padding = Math.max(range * 0.2, 1);

            temperatureChart.data.labels = history.map(() => "");
            temperatureChart.data.datasets[0].data = temps;
            temperatureChart.options.scales.y.min = minTemp - padding;
            temperatureChart.options.scales.y.max = maxTemp + padding;
            temperatureChart.update();
          }
        } catch (err) {
          console.error("Failed to fetch temperature history", err);
        }
      }

      async function refreshStatus() {
        try {
          const data = await apiCall("/api/status");
          temperatureEl.textContent =
            data.temperature !== null
              ? `${data.temperature.toFixed(1)} °C`
              : "-- °C";
          patternEl.textContent = data.pattern || "OFF";
          tempResponsiveBtn.classList.toggle(
            "active",
            data.pattern === "TEMPERATURE_RESPONSIVE",
          );
          if (data.led_states) {
            ledStates = data.led_states;
            updateLEDButtons();
          }
        } catch (err) {
          showStatus(statusEl, "Failed to fetch live data");
        }
      }
      async function setPattern(pattern) {
        try {
          const data = await apiCall("/api/pattern", "POST", { pattern });
          if (!data.ok) {
            showStatus(statusEl, data.error || "Pattern update failed");
            return;
          }
          showStatus(statusEl, `Pattern set to ${data.pattern}`);
          await refreshStatus();
        } catch (err) {
          showStatus(statusEl, "Pattern update failed");
        }
      }

      async function setTemperatureResponsive(enabled) {
        try {
          const data = await apiCall("/api/temperature-responsive", "POST", {
            enabled,
          });
          if (!data.ok) {
            showStatus(tempStatus, "Failed to update mode");
            return;
          }
          showStatus(
            tempStatus,
            enabled ? "Temperature mode enabled" : "Temperature mode disabled",
          );
          await refreshStatus();
        } catch (err) {
          showStatus(tempStatus, "Mode update failed");
        }
      }

      async function toggleLED(index) {
        ledStates[index] = !ledStates[index];
        try {
          const data = await apiCall("/api/manual-led", "POST", {
            states: ledStates,
          });
          if (!data.ok) {
            ledStates[index] = !ledStates[index];
            showStatus(manualStatus, data.error || "LED update failed");
            return;
          }
          updateLEDButtons();
          showStatus(manualStatus, "LED updated");
        } catch (err) {
          ledStates[index] = !ledStates[index];
          showStatus(manualStatus, "LED update failed");
        }
      }

      function updateLEDButtons() {
        document.querySelectorAll(".led-btn").forEach((btn) => {
          btn.classList.toggle("on", ledStates[parseInt(btn.dataset.index)]);
        });
      }

      document
        .querySelectorAll("button[data-pattern]")
        .forEach((btn) =>
          btn.addEventListener("click", () => setPattern(btn.dataset.pattern)),
        );

      document
        .querySelectorAll(".led-btn")
        .forEach((btn) =>
          btn.addEventListener("click", () =>
            toggleLED(parseInt(btn.dataset.index)),
          ),
        );

      tempResponsiveBtn.addEventListener("click", () =>
        setTemperatureResponsive(
          !tempResponsiveBtn.classList.contains("active"),
        ),
      );

      initChart();
      updateLEDButtons();
      refreshStatus();
      updateTemperatureChart();
      setInterval(refreshStatus, 1000);
      setInterval(updateTemperatureChart, 2000);
    </script>
  </body>
</html>
