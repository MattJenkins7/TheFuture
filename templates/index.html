<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Sensor Dashboard</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --card: #ffffff;
        --text: #13223a;
        --muted: #50617d;
        --accent: #1677ff;
        --accent-2: #0f4fae;
        --ok: #0f9d58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(
          circle at 10% 20%,
          #e8f2ff 0%,
          var(--bg) 45%,
          #eef8ff 100%
        );
        min-height: 100vh;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }

      .header {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 1.75rem;
      }

      .sub {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 10px 28px rgba(18, 38, 75, 0.08);
      }

      .label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .value {
        margin-top: 6px;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .pattern {
        margin-top: 18px;
      }

      .buttons {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        transition: background 0.2s;
        flex: 1;
        min-width: 80px;
      }

      button:hover {
        background: var(--accent-2);
      }

      button:active {
        transform: scale(0.98);
      }

      .status {
        margin-top: 12px;
        color: var(--ok);
        min-height: 1.2em;
        font-size: 0.9rem;
      }

      .chart-container {
        position: relative;
        height: 250px;
        margin-top: 16px;
      }

      .temp-responsive-section {
        margin-top: 18px;
      }

      button.active {
        background: var(--ok);
      }

      .manual-controls {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 12px;
      }

      .led-btn {
        aspect-ratio: 1;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition:
          transform 0.2s,
          opacity 0.2s,
          box-shadow 0.2s;
        opacity: 0.5;
      }

      .led-btn:hover {
        transform: scale(1.05);
      }

      .led-btn.on {
        opacity: 1;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }

      .led-btn.red {
        background: #ff4444;
      }

      .led-btn.yellow {
        background: #ffdd00;
      }

      .led-btn.green {
        background: #00dd00;
      }

      /* Mobile responsive styles */
      @media (max-width: 768px) {
        .wrap {
          padding: 12px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .grid {
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
          gap: 10px;
        }

        .card {
          padding: 12px;
          border-radius: 10px;
        }

        .label {
          font-size: 0.8rem;
        }

        .value {
          font-size: 1.3rem;
          margin-top: 4px;
        }

        .buttons {
          gap: 6px;
        }

        button {
          padding: 10px 12px;
          font-size: 0.9rem;
          min-width: 70px;
        }

        .speed-value {
          font-size: 1.3rem;
        }

        .chart-container {
          height: 200px;
        }

        .status {
          font-size: 0.85rem;
        }
      }

      @media (max-width: 480px) {
        .wrap {
          padding: 10px;
        }

        h1 {
          font-size: 1.25rem;
          margin: 0 0 2px;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .card {
          padding: 10px;
          border-radius: 8px;
        }

        .label {
          font-size: 0.75rem;
        }

        .value {
          font-size: 1.2rem;
          margin-top: 4px;
        }

        .buttons {
          gap: 6px;
          justify-content: space-between;
        }

        button {
          padding: 10px 10px;
          font-size: 0.85rem;
          flex: 1;
          min-width: 60px;
        }

        .speed-display {
          flex-direction: column;
          align-items: flex-start;
        }

        .speed-value {
          font-size: 1.2rem;
        }

        .chart-container {
          height: 180px;
        }

        .status {
          font-size: 0.8rem;
        }

        .pattern {
          margin-top: 14px;
        }

        .speed-control {
          margin-top: 14px;
        }

        .temp-responsive-section {
          margin-top: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="header">
        <h1>ESP32 Live Dashboard</h1>
      </section>

      <section class="grid">
        <article class="card">
          <div class="label">Temperature</div>
          <div class="value" id="temperature">--</div>
        </article>
        <article class="card">
          <div class="label">Current LED Pattern</div>
          <div class="value" id="pattern">OFF</div>
        </article>
      </section>

      <section class="card pattern">
        <div class="label">Change LED Pattern</div>
        <div class="buttons">
          <button data-pattern="OFF">OFF</button>
          <button data-pattern="BLINK">BLINK</button>
          <button data-pattern="WAVE">WAVE</button>
          <button data-pattern="RAINBOW">RAINBOW</button>
          <button data-pattern="FLICKER">FLICKER</button>
        </div>
        <div class="status" id="status"></div>
      </section>

      <section class="card temp-responsive-section">
        <div class="label">Temperature Responsive Mode</div>
        <div class="buttons">
          <button id="tempResponsiveBtn" data-pattern="TEMPERATURE_RESPONSIVE">
            Enable Temp Mode
          </button>
        </div>
        <div class="status" id="tempStatus"></div>
      </section>

      <section class="card">
        <div class="label">Manual LED Control</div>
        <div class="manual-controls">
          <button class="led-btn red on" data-index="0" title="Red (LED 1)">
            1
          </button>
          <button class="led-btn yellow" data-index="1" title="Yellow (LED 2)">
            2
          </button>
          <button class="led-btn green" data-index="2" title="Green (LED 3)">
            3
          </button>
          <button class="led-btn yellow" data-index="3" title="Yellow (LED 4)">
            4
          </button>
          <button class="led-btn red" data-index="4" title="Red (LED 5)">
            5
          </button>
        </div>
        <div class="status" id="manualStatus"></div>
      </section>

      <section class="card">
        <div class="label">Temperature Over Time</div>
        <div class="chart-container">
          <canvas id="temperatureChart"></canvas>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script>
      const temperatureEl = document.getElementById("temperature");
      const patternEl = document.getElementById("pattern");
      const statusEl = document.getElementById("status");
      const tempStatus = document.getElementById("tempStatus");
      const tempResponsiveBtn = document.getElementById("tempResponsiveBtn");
      const manualStatus = document.getElementById("manualStatus");

      let temperatureChart = null;
      let ledStates = [true, false, false, false, false];

      function fmt(value, unit = "") {
        return value === null || value === undefined ? "--" : `${value}${unit}`;
      }

      function initChart() {
        const ctx = document
          .getElementById("temperatureChart")
          .getContext("2d");
        temperatureChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Temperature (°C)",
                data: [],
                borderColor: "#ff4444",
                backgroundColor: "rgba(255, 68, 68, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
            },
            scales: {
              y: {
                beginAtZero: false,
                min: -10,
                max: 40,
              },
            },
          },
        });
      }

      async function updateTemperatureChart() {
        try {
          const res = await fetch("/api/temperature-history");
          const data = await res.json();
          const history = data.history || [];

          if (temperatureChart && history.length > 0) {
            const labels = history.map((entry) => {
              const date = new Date(entry.time);
              return date.toLocaleTimeString();
            });
            const temps = history.map((entry) => entry.temp);

            temperatureChart.data.labels = labels;
            temperatureChart.data.datasets[0].data = temps;
            temperatureChart.update();
          }
        } catch (err) {
          console.error("Failed to fetch temperature history", err);
        }
      }

      async function refreshStatus() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();

          try {
            const histRes = await fetch("/api/temperature-history");
            const histData = await histRes.json();
            const history = histData.history || [];
            if (history.length > 0) {
              const latestTemp = history[history.length - 1].temp;
              temperatureEl.textContent = fmt(latestTemp, " C");
            } else {
              temperatureEl.textContent = fmt(data.temperature, " C");
            }
          } catch (err) {
            temperatureEl.textContent = fmt(data.temperature, " C");
          }

          patternEl.textContent = data.pattern || "OFF";

          // Update temp responsive button state
          if (data.pattern === "TEMPERATURE_RESPONSIVE") {
            tempResponsiveBtn.classList.add("active");
          } else {
            tempResponsiveBtn.classList.remove("active");
          }

          // Update LED states if available
          if (data.led_states) {
            ledStates = data.led_states;
            updateLEDButtons();
          }
        } catch (err) {
          statusEl.textContent = "Failed to fetch live data";
        }
      }

      async function setPattern(pattern) {
        try {
          const res = await fetch("/api/pattern", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pattern }),
          });

          const data = await res.json();
          if (!data.ok) {
            statusEl.textContent = data.error || "Pattern update failed";
            return;
          }

          statusEl.textContent = `Pattern set to ${data.pattern}`;
          await refreshStatus();
        } catch (err) {
          statusEl.textContent = "Pattern update failed";
        }
      }

      async function setTemperatureResponsive(enabled) {
        try {
          const res = await fetch("/api/temperature-responsive", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled }),
          });

          const data = await res.json();
          if (!data.ok) {
            tempStatus.textContent = "Failed to update mode";
            return;
          }

          tempStatus.textContent = enabled
            ? "Temperature mode enabled"
            : "Temperature mode disabled";
          await refreshStatus();
        } catch (err) {
          tempStatus.textContent = "Mode update failed";
        }
      }

      async function toggleLED(index) {
        ledStates[index] = !ledStates[index];
        try {
          const res = await fetch("/api/manual-led", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ states: ledStates }),
          });

          const data = await res.json();
          if (!data.ok) {
            ledStates[index] = !ledStates[index];
            manualStatus.textContent = data.error || "LED update failed";
            return;
          }

          updateLEDButtons();
          manualStatus.textContent = "LED updated";
        } catch (err) {
          ledStates[index] = !ledStates[index];
          manualStatus.textContent = "LED update failed";
        }
      }

      function updateLEDButtons() {
        document.querySelectorAll(".led-btn").forEach((btn) => {
          const index = parseInt(btn.dataset.index);
          if (ledStates[index]) {
            btn.classList.add("on");
          } else {
            btn.classList.remove("on");
          }
        });
      }

      document.querySelectorAll("button[data-pattern]").forEach((btn) => {
        btn.addEventListener("click", () => setPattern(btn.dataset.pattern));
      });

      document.querySelectorAll(".led-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const index = parseInt(btn.dataset.index);
          toggleLED(index);
        });
      });

      tempResponsiveBtn.addEventListener("click", () => {
        const isCurrentlyEnabled =
          tempResponsiveBtn.classList.contains("active");
        setTemperatureResponsive(!isCurrentlyEnabled);
      });

      initChart();
      updateLEDButtons();
      refreshStatus();
      updateTemperatureChart();
      setInterval(refreshStatus, 1000);
      setInterval(updateTemperatureChart, 2000);
    </script>
  </body>
</html>
