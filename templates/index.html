<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Sensor Dashboard</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --card: #ffffff;
        --text: #13223a;
        --muted: #50617d;
        --accent: #1677ff;
        --accent-2: #0f4fae;
        --ok: #0f9d58;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 20%, #e8f2ff 0%, var(--bg) 45%, #eef8ff 100%);
        min-height: 100vh;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 2rem;
      }

      .sub {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
      }

      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 28px rgba(18, 38, 75, 0.08);
      }

      .label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .value {
        margin-top: 6px;
        font-size: 1.6rem;
        font-weight: 700;
      }

      .pattern {
        margin-top: 22px;
      }

      .buttons {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: var(--accent-2);
      }

      .status {
        margin-top: 16px;
        color: var(--ok);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="header">
        <h1>ESP32 Live Dashboard</h1>
      </section>

      <section class="grid">
        <article class="card">
          <div class="label">Temperature</div>
          <div class="value" id="temperature">--</div>
        </article>
        <article class="card">
          <div class="label">Current LED Pattern</div>
          <div class="value" id="pattern">OFF</div>
        </article>
      </section>

      <section class="card pattern">
        <div class="label">Change LED Pattern</div>
        <div class="buttons">
          <button data-pattern="OFF">OFF</button>
          <button data-pattern="BLINK">BLINK</button>
          <button data-pattern="WAVE">WAVE</button>
          <button data-pattern="RAINBOW">RAINBOW</button>
          <button data-pattern="FLICKER">FLICKER</button>
        </div>
        <div class="status" id="status"></div>
      </section>
    </main>

    <script>
      const temperatureEl = document.getElementById("temperature");
      const patternEl = document.getElementById("pattern");
      const statusEl = document.getElementById("status");

      function fmt(value, unit = "") {
        return value === null || value === undefined ? "--" : `${value}${unit}`;
      }

      async function refreshStatus() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();

          temperatureEl.textContent = fmt(data.temperature, " C");
          patternEl.textContent = data.pattern || "OFF";
        } catch (err) {
          statusEl.textContent = "Failed to fetch live data";
        }
      }

      async function setPattern(pattern) {
        try {
          const res = await fetch("/api/pattern", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pattern })
          });

          const data = await res.json();
          if (!data.ok) {
            statusEl.textContent = data.error || "Pattern update failed";
            return;
          }

          statusEl.textContent = `Pattern set to ${data.pattern}`;
          await refreshStatus();
        } catch (err) {
          statusEl.textContent = "Pattern update failed";
        }
      }

      document.querySelectorAll("button[data-pattern]").forEach((btn) => {
        btn.addEventListener("click", () => setPattern(btn.dataset.pattern));
      });

      refreshStatus();
      setInterval(refreshStatus, 1000);
    </script>
  </body>
</html>
