<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Sensor Dashboard</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --card: #ffffff;
        --text: #13223a;
        --muted: #50617d;
        --accent: #1677ff;
        --accent-2: #0f4fae;
        --ok: #0f9d58;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(
          circle at 10% 20%,
          #e8f2ff 0%,
          var(--bg) 45%,
          #eef8ff 100%
        );
        min-height: 100vh;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 2rem;
      }

      .sub {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
      }

      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 28px rgba(18, 38, 75, 0.08);
      }

      .label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .value {
        margin-top: 6px;
        font-size: 1.6rem;
        font-weight: 700;
      }

      .pattern {
        margin-top: 22px;
      }

      .buttons {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: var(--accent-2);
      }

      .status {
        margin-top: 16px;
        color: var(--ok);
        min-height: 1.2em;
      }

      .speed-control {
        margin-top: 22px;
      }

      .speed-display {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .speed-value {
        font-size: 1.6rem;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        height: 8px;
        border-radius: 5px;
        background: #e0e0e0;
        outline: none;
        -webkit-appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: none;
      }

      .chart-container {
        position: relative;
        height: 300px;
        margin-top: 16px;
      }

      .temp-responsive-section {
        margin-top: 22px;
      }

      button.active {
        background: var(--ok);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="header">
        <h1>ESP32 Live Dashboard</h1>
      </section>

      <section class="grid">
        <article class="card">
          <div class="label">Temperature</div>
          <div class="value" id="temperature">--</div>
        </article>
        <article class="card">
          <div class="label">Current LED Pattern</div>
          <div class="value" id="pattern">OFF</div>
        </article>
      </section>

      <section class="card pattern">
        <div class="label">Change LED Pattern</div>
        <div class="buttons">
          <button data-pattern="OFF">OFF</button>
          <button data-pattern="BLINK">BLINK</button>
          <button data-pattern="WAVE">WAVE</button>
          <button data-pattern="RAINBOW">RAINBOW</button>
          <button data-pattern="FLICKER">FLICKER</button>
        </div>
        <div class="status" id="status"></div>
      </section>

      <section class="card speed-control">
        <div class="label">LED Speed</div>
        <div class="speed-display">
          <input
            type="range"
            id="speedSlider"
            min="500"
            max="3000"
            value="500"
            step="50"
          />
        </div>
        <div style="text-align: center; margin-top: 8px">
          <span class="speed-value" id="speedValue">500</span> ms
        </div>
        <div class="status" id="speedStatus"></div>
      </section>

      <section class="card temp-responsive-section">
        <div class="label">Temperature Responsive Mode</div>
        <div class="buttons">
          <button id="tempResponsiveBtn" data-pattern="TEMPERATURE_RESPONSIVE">
            Enable Temp Mode
          </button>
        </div>
        <div class="status" id="tempStatus"></div>
      </section>

      <section class="card">
        <div class="label">Temperature Over Time</div>
        <div class="chart-container">
          <canvas id="temperatureChart"></canvas>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script>
      const temperatureEl = document.getElementById("temperature");
      const patternEl = document.getElementById("pattern");
      const statusEl = document.getElementById("status");
      const speedSlider = document.getElementById("speedSlider");
      const speedValue = document.getElementById("speedValue");
      const speedStatus = document.getElementById("speedStatus");
      const tempStatus = document.getElementById("tempStatus");
      const tempResponsiveBtn = document.getElementById("tempResponsiveBtn");

      let temperatureChart = null;

      function fmt(value, unit = "") {
        return value === null || value === undefined ? "--" : `${value}${unit}`;
      }

      function initChart() {
        const ctx = document
          .getElementById("temperatureChart")
          .getContext("2d");
        temperatureChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Temperature (°C)",
                data: [],
                borderColor: "#ff4444",
                backgroundColor: "rgba(255, 68, 68, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
            },
            scales: {
              y: {
                beginAtZero: false,
                min: -10,
                max: 40,
              },
            },
          },
        });
      }

      async function updateTemperatureChart() {
        try {
          const res = await fetch("/api/temperature-history");
          const data = await res.json();
          const history = data.history || [];

          if (temperatureChart && history.length > 0) {
            const labels = history.map((entry) => {
              const date = new Date(entry.time);
              return date.toLocaleTimeString();
            });
            const temps = history.map((entry) => entry.temp);

            temperatureChart.data.labels = labels;
            temperatureChart.data.datasets[0].data = temps;
            temperatureChart.update();
          }
        } catch (err) {
          console.error("Failed to fetch temperature history", err);
        }
      }

      async function refreshStatus() {
        try {
          const res = await fetch("/api/status");
          const data = await res.json();

          temperatureEl.textContent = fmt(data.temperature, " C");
          patternEl.textContent = data.pattern || "OFF";

          // Update temp responsive button state
          if (data.pattern === "TEMPERATURE_RESPONSIVE") {
            tempResponsiveBtn.classList.add("active");
          } else {
            tempResponsiveBtn.classList.remove("active");
          }

          if (data.speed) {
            speedSlider.value = data.speed;
            speedValue.textContent = data.speed;
          }
        } catch (err) {
          statusEl.textContent = "Failed to fetch live data";
        }
      }

      async function setPattern(pattern) {
        try {
          const res = await fetch("/api/pattern", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pattern }),
          });

          const data = await res.json();
          if (!data.ok) {
            statusEl.textContent = data.error || "Pattern update failed";
            return;
          }

          statusEl.textContent = `Pattern set to ${data.pattern}`;
          await refreshStatus();
        } catch (err) {
          statusEl.textContent = "Pattern update failed";
        }
      }

      async function setTemperatureResponsive(enabled) {
        try {
          const res = await fetch("/api/temperature-responsive", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled }),
          });

          const data = await res.json();
          if (!data.ok) {
            tempStatus.textContent = "Failed to update mode";
            return;
          }

          tempStatus.textContent = enabled
            ? "Temperature mode enabled"
            : "Temperature mode disabled";
          await refreshStatus();
        } catch (err) {
          tempStatus.textContent = "Mode update failed";
        }
      }

      async function setSpeed(speed) {
        try {
          const res = await fetch("/api/speed", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ speed: parseInt(speed) }),
          });

          const data = await res.json();
          if (!data.ok) {
            speedStatus.textContent = data.error || "Speed update failed";
            return;
          }

          speedStatus.textContent = `Speed set to ${data.speed} ms`;
          speedValue.textContent = data.speed;
        } catch (err) {
          speedStatus.textContent = "Speed update failed";
        }
      }

      document.querySelectorAll("button[data-pattern]").forEach((btn) => {
        btn.addEventListener("click", () => setPattern(btn.dataset.pattern));
      });

      tempResponsiveBtn.addEventListener("click", () => {
        const isCurrentlyEnabled =
          tempResponsiveBtn.classList.contains("active");
        setTemperatureResponsive(!isCurrentlyEnabled);
      });

      speedSlider.addEventListener("input", (e) => {
        speedValue.textContent = e.target.value;
      });

      speedSlider.addEventListener("change", (e) => {
        setSpeed(e.target.value);
      });

      initChart();
      refreshStatus();
      updateTemperatureChart();
      setInterval(refreshStatus, 1000);
      setInterval(updateTemperatureChart, 2000);
    </script>
  </body>
</html>
